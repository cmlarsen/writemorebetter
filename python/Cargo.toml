[package]
name = "writemorebetter-python"
version = "0.14.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for writemorebetter: English grammar and spelling checking without a JVM. Bundles third-party data under its own licenses (CMUdict, CC BY word norms); see NOTICE."
publish = false

[lib]
# The extension module is `writemorebetter._native`; the pure-Python package in
# python/writemorebetter/ wraps it (see pyproject.toml).
name = "_native"
crate-type = ["cdylib"]

[dependencies]
writemorebetter-style = { path = "../style" }
nlprule = { path = "../nlprule" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# abi3: one wheel per platform covers CPython 3.9 and later.
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[features]
# maturin turns this on for wheels (pyproject.toml); a plain `cargo build` leaves it off.
extension-module = ["pyo3/extension-module"]
