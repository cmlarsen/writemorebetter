name: Swift

on:
  push:
    branches:
      - main
  pull_request:

# A new push to a PR cancels that PR's older runs. On main, runs never cancel each other;
# a newer push replaces only a run that is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Swift package (LanguageTool 6.6 data)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          # build/requirements.txt pins old packages (lxml 4.6.3); 3.9 is the newest
          # interpreter with wheels for them.
          python-version: '3.9'

      # The data is built by the same pinned script as CI and the release workflow.
      # Only the downloads, the portable JRE and the build venv are cached.
      - name: Cache LanguageTool download, portable JRE and build venv
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lt-data-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}

      - name: Build data (pinned LanguageTool 6.6)
        run: scripts/build-data.sh --out-dir storage/66

      - name: Build the XCFramework and regenerate the Swift bindings
        run: ./scripts/build-xcframework.sh

      - name: Check the committed bindings match the generated ones
        run: git diff --exit-code -- swift/Sources/WriteMoreBetter/Generated

      - name: Test the Swift package
        run: swift test
