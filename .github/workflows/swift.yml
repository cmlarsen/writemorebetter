name: Swift

on:
  push:
    branches:
      - main
  # A PR pays for a macOS XCFramework build here, so only run when the package or what it
  # builds from changes. Every push to main still runs.
  pull_request:
    paths:
      - 'swift/**'
      - 'Package.swift'
      - 'nlprule/**'
      - 'style/**'
      - 'srx/**'
      - 'build/**'
      - 'binaries/**'
      - 'Cargo.toml'
      - 'scripts/build-data.sh'
      - 'scripts/build-xcframework.sh'
      - 'LICENSE-MIT'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.github/actions/build-data/**'
      - '.github/workflows/swift.yml'

# A new push to a PR cancels that PR's older runs. On main, runs never cancel each other;
# a newer push replaces only a run that is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Swift package (LanguageTool 6.6 data)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      # The same pinned script as CI and the release workflow, cached on its inputs.
      - name: Build data (pinned LanguageTool 6.6)
        uses: ./.github/actions/build-data
        with:
          out-dir: storage/66

      - name: Build the XCFramework and regenerate the Swift bindings
        run: ./scripts/build-xcframework.sh

      - name: Check the committed bindings match the generated ones
        run: git diff --exit-code -- swift/Sources/WriteMoreBetter/Generated

      - name: Test the Swift package
        run: swift test
