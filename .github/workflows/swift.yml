name: Swift

on:
  push:
    branches:
      - main
  # A PR pays for a macOS XCFramework build here, so it runs only when the Swift package
  # itself changes. CI's English job still compiles the swift crate on every PR (clippy and
  # tests cover the workspace), so an engine change that breaks it fails there; one that only
  # changes the generated bindings shows on the next push to main. Every push to main runs.
  pull_request:
    paths:
      - 'swift/**'
      - 'Package.swift'
      - 'scripts/build-xcframework.sh'
      - 'scripts/consumer-check.sh'
      - '.github/workflows/swift.yml'

# A newer push cancels older runs, on main as on a PR: while iterating, only the latest
# commit's result matters, and stale main runs held runners that PRs were waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift package (LanguageTool 6.6 data)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The same pinned script as CI and the release workflow, cached on its inputs.
      - name: Build data (pinned LanguageTool 6.6)
        uses: ./.github/actions/build-data
        with:
          out-dir: storage/66

      - name: Build the XCFramework and regenerate the Swift bindings
        run: ./scripts/build-xcframework.sh

      - name: Check the committed bindings match the generated ones
        run: git diff --exit-code -- swift/Sources/WriteMoreBetter/Generated

      - name: Test the Swift package
        run: swift test
