name: CI

on:
  push:
    branches:
      - main
  # Every PR that can change a build or a gate; docs-only changes skip CI. Every push to main
  # still runs.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

# A new push to a PR cancels that PR's older runs. On main, runs never cancel each other;
# a newer push replaces only a run that is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  english:
    name: English (LanguageTool 6.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench/tools/wmb-probe -> target

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # The same pinned script as the release workflow, cached on its inputs; see the action.
      - name: Build data (pinned LanguageTool 6.6)
        uses: ./.github/actions/build-data
        with:
          out-dir: storage

      - name: Check formatting
        run: cargo fmt --all -- --check

      # No separate debug build: clippy type-checks every target and the release test build
      # compiles them, so a `cargo build` here only compiled the workspace a third time.
      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features regex-fancy -p nlprule

      - name: Lint with clippy
        run: cargo clippy --workspace --exclude writemorebetter-python --all-features

      - name: Test
        run: cargo test --workspace --exclude writemorebetter-python --all-features --release

      - name: Build wasm package and run its JS tests
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129
          cargo build --release --target wasm32-unknown-unknown -p writemorebetter-wasm
          wasm-bindgen --target nodejs --out-dir wasm/pkg \
            target/wasm32-unknown-unknown/release/writemorebetter_wasm.wasm
          node wasm/test.mjs

      - name: Public corpus recall
        env:
          RECALL_MIN: 60
        run: |
          cargo build --release --manifest-path bench/tools/wmb-probe/Cargo.toml
          python3 bench/tools/public_recall.py --min "$RECALL_MIN"

      - name: Disambiguation conformance
        env:
          RUST_LOG: WARN
          DISAMBIG_PASSING: 1016
        run: |
          # the binary exits 1 when any rule fails its examples; the floor below is the gate
          cargo run --release --all-features --bin test_disambiguation -- --tokenizer storage/en_tokenizer.bin > storage/disambiguation_conformance.log 2>&1 || true
          tail -n 20 storage/disambiguation_conformance.log
          runnable=$(grep -m1 '^Runnable rules: ' storage/disambiguation_conformance.log | awk '{print $3}' || true)
          passing=$(grep -m1 '^Rules passing tests: ' storage/disambiguation_conformance.log | awk '{print $4}' || true)
          echo "Runnable rules: ${runnable:-unknown}"
          echo "Rules passing tests: ${passing:-unknown}"
          if [ -z "${runnable}" ] || [ -z "${passing}" ]; then
            echo "::error::Disambiguation conformance output not found"
            exit 1
          fi
          if [ "${passing}" -lt "${DISAMBIG_PASSING}" ]; then
            echo "::error::Disambiguation conformance regressed: ${passing}/${runnable} rules passing, floor is ${DISAMBIG_PASSING} passing"
            exit 1
          fi
          if [ "${runnable}" -lt "${DISAMBIG_PASSING}" ]; then
            echo "::error::Disambiguation conformance regressed: ${runnable} runnable rules, floor is ${DISAMBIG_PASSING} (docs/BASELINE.md)"
            exit 1
          fi

      - name: Grammar conformance
        env:
          RUST_LOG: WARN
          GRAMMAR_PASSING: 6085
          GRAMMAR_RUNNABLE: 6085
        run: |
          # the binary exits 1 when any rule fails its examples; the floors below are the gate
          cargo run --release --all-features --bin test -- --tokenizer storage/en_tokenizer.bin --rules storage/en_rules.bin > storage/grammar_conformance.log 2>&1 || true
          tail -n 20 storage/grammar_conformance.log
          runnable=$(grep -m1 '^Runnable rules: ' storage/grammar_conformance.log | awk '{print $3}' || true)
          passing=$(grep -m1 '^Rules passing tests: ' storage/grammar_conformance.log | awk '{print $4}' || true)
          echo "Runnable rules: ${runnable:-unknown}"
          echo "Rules passing tests: ${passing:-unknown}"
          if [ -z "${runnable}" ] || [ -z "${passing}" ]; then
            echo "::error::Grammar conformance output not found"
            exit 1
          fi
          if [ "${passing}" -lt "${GRAMMAR_PASSING}" ]; then
            echo "::error::Grammar conformance regressed: ${passing}/${runnable} rules passing, floor is ${GRAMMAR_PASSING} passing"
            exit 1
          fi
          if [ "${runnable}" -lt "${GRAMMAR_RUNNABLE}" ]; then
            echo "::error::Grammar conformance regressed: ${runnable} runnable rules, floor is ${GRAMMAR_RUNNABLE} (docs/BASELINE.md)"
            exit 1
          fi

  # The style crate's benchmark and accuracy gates, in parallel with the English job. They need
  # the tokenizer, from the same cached data build.
  style:
    name: Style gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The bench tools are separate crates with their own target directories; caching them
      # keeps them from rebuilding the engine on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench/tools/wmb-analyze -> target
            bench/tools/wmb-document -> target
            bench/tools/wmb-cliches -> target

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Build data (pinned LanguageTool 6.6)
        uses: ./.github/actions/build-data
        with:
          out-dir: storage

      # The tables keep only the words the heuristic syllable counter and the spelling-based
      # first-sound guess get wrong, so any change to either must regenerate them. The script
      # refuses any other sha256.
      - name: Cache CMUdict
        uses: actions/cache@v4
        with:
          path: data/cache/cmudict
          key: cmudict-74790861f652b15e4ac49015a90074ad62a27690

      - name: CMUdict syllable and onset tables are current
        run: |
          mkdir -p data/cache/cmudict
          dict=data/cache/cmudict/cmudict.dict
          [ -f "$dict" ] || curl -sSfL -o "$dict" \
            https://raw.githubusercontent.com/cmusphinx/cmudict/74790861f652b15e4ac49015a90074ad62a27690/cmudict.dict
          python3 scripts/build-cmudict.py "$dict"
          if ! git diff --exit-code style/data/pronunciation/; then
            echo "::error::style/data/pronunciation/ is stale; run scripts/build-cmudict.py after changing the syllable heuristic or spelled_onset"
            exit 1
          fi

      - name: Cache public style datasets
        uses: actions/cache@v4
        with:
          path: bench/style/.cache
          key: style-data-${{ hashFiles('bench/style/sources.json') }}

      - name: Style benchmark accuracy gates
        run: |
          cargo fmt --manifest-path bench/tools/wmb-analyze/Cargo.toml -- --check
          cargo fmt --manifest-path bench/tools/wmb-document/Cargo.toml -- --check
          cargo fmt --manifest-path bench/tools/wmb-cliches/Cargo.toml -- --check
          cargo build --release --manifest-path bench/tools/wmb-analyze/Cargo.toml
          cargo build --release --manifest-path bench/tools/wmb-document/Cargo.toml
          cargo build --release --manifest-path bench/tools/wmb-cliches/Cargo.toml
          python3 -m unittest discover -s bench/style -p 'test_*.py'
          python3 bench/style/run.py tier1 --gate --analyzer bench/tools/wmb-analyze/target/release/wmb-analyze --document-probe bench/tools/wmb-document/target/release/wmb-document
          python3 bench/style/run.py tier2 pacing --gate --document-probe bench/tools/wmb-document/target/release/pacing
          python3 bench/style/run.py tier3 --pacing --self-test --probe bench/tools/wmb-document/target/release/pacing
          python3 bench/style/pacing_labels.py check
          python3 bench/style/pacing_labels.py score --gate --probe bench/tools/wmb-document/target/release/pacing
          python3 bench/style/emotion_tells.py score --gate
          python3 bench/style/run.py tier2 smoke
          python3 bench/style/transitions_pronouns.py --gate
          python3 bench/style/echoes.py --gate --probe bench/tools/wmb-document/target/release/wmb-echoes
          python3 bench/style/run.py cliches --gate --probe bench/tools/wmb-cliches/target/release/wmb-cliches
          python3 bench/style/run.py tier2 sentences --gate --document-probe bench/tools/wmb-document/target/release/wmb-document
          python3 bench/style/run.py tier3 --sentence-length --self-test --document-probe bench/tools/wmb-document/target/release/wmb-document
          python3 bench/style/run.py tier3 --self-test --analyzer bench/tools/wmb-analyze/target/release/wmb-analyze
          python3 bench/style/run.py tier3 --flag-rates --self-test --probe bench/tools/wmb-document/target/release/flag_rates
          python3 bench/style/run.py tier3 --flag-rates --self-test --skip-diction --probe bench/tools/wmb-document/target/release/flag_rates
          python3 bench/style/run.py dialogue-tags tier2 --probe bench/tools/wmb-document/target/release/dialogue_tags
          python3 bench/style/run.py dialogue-tags tier3 --self-test --probe bench/tools/wmb-document/target/release/dialogue_tags
          cargo build -p writemorebetter-style --release --example norm_reports
          python3 bench/style/norms.py --probe target/release/examples/norm_reports
          cargo build -p writemorebetter-style --release --example diction_coverage
          python3 bench/style/concreteness.py --gate --probe target/release/examples/diction_coverage

      - name: Style lexical report accuracy gates (256)
        run: |
          python3 bench/style/lexical.py --gate --probe bench/tools/wmb-document/target/release/lexical_reports
