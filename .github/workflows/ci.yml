name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Download English build data
        run: |
          mkdir -p data storage
          curl -sSL -o data/en.zip https://f000.backblazeb2.com/file/nlprule/en.zip
          unzip -q data/en.zip -d data
          mkdir -p data/en/builtin
          cp -r build/builtin-data/en/. data/en/builtin/

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --exclude nlprule-python --all-features

      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features regex-fancy -p nlprule

      - name: Lint with clippy
        run: cargo clippy --workspace --exclude nlprule-python --all-features

      - name: Compile English binaries
        env:
          RUST_LOG: INFO
        run: cargo run --release --all-features --bin compile -- --build-dir data/en --tokenizer-out storage/en_tokenizer.bin --rules-out storage/en_rules.bin

      - name: Test
        run: cargo test --workspace --exclude nlprule-python --all-features --release

      - name: Public corpus recall
        run: |
          cargo build --release --manifest-path bench/tools/wmb-probe/Cargo.toml
          python3 bench/tools/public_recall.py --min 46

      - name: Disambiguation conformance
        env:
          RUST_LOG: WARN
        run: |
          set -o pipefail
          cargo run --release --all-features --bin test_disambiguation -- --tokenizer storage/en_tokenizer.bin 2>&1 | tee storage/disambiguation_conformance.log
          runnable=$(grep -m1 '^Runnable rules: ' storage/disambiguation_conformance.log | awk '{print $3}' || true)
          passing=$(grep -m1 '^Rules passing tests: ' storage/disambiguation_conformance.log | awk '{print $4}' || true)
          echo "Runnable rules: ${runnable:-unknown}"
          echo "Rules passing tests: ${passing:-unknown}"
          if [ -z "${runnable}" ] || [ -z "${passing}" ] || [ "${runnable}" != "${passing}" ]; then
            echo "::error::Disambiguation conformance failed: ${passing:-?}/${runnable:-?} rules passing"
            exit 1
          fi
          if [ "${runnable}" -lt 843 ]; then
            echo "::error::Disambiguation conformance regressed: ${runnable} runnable rules, baseline is 843 (docs/BASELINE.md)"
            exit 1
          fi

      - name: Grammar conformance
        env:
          RUST_LOG: WARN
        run: |
          set -o pipefail
          cargo run --release --all-features --bin test -- --tokenizer storage/en_tokenizer.bin --rules storage/en_rules.bin 2>&1 | tee storage/grammar_conformance.log
          runnable=$(grep -m1 '^Runnable rules: ' storage/grammar_conformance.log | awk '{print $3}' || true)
          passing=$(grep -m1 '^Rules passing tests: ' storage/grammar_conformance.log | awk '{print $4}' || true)
          echo "Runnable rules: ${runnable:-unknown}"
          echo "Rules passing tests: ${passing:-unknown}"
          if [ -z "${runnable}" ] || [ -z "${passing}" ] || [ "${runnable}" != "${passing}" ]; then
            echo "::error::Grammar conformance failed: ${passing:-?}/${runnable:-?} rules passing"
            exit 1
          fi
          if [ "${runnable}" -lt 3749 ]; then
            echo "::error::Grammar conformance regressed: ${runnable} runnable rules, baseline is 3749 (docs/BASELINE.md)"
            exit 1
          fi
