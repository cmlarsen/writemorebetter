name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  english:
    name: English (LanguageTool 6.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          # build/requirements.txt pins old packages (lxml 4.6.3); 3.9 is the newest
          # interpreter with wheels for them.
          python-version: '3.9'

      # The LanguageTool download, the portable JRE and the build venv are cached;
      # the build directory itself is regenerated by scripts/build-data.sh so CI
      # and the release workflow use identical, pinned inputs.
      - name: Cache LanguageTool download, portable JRE and build venv
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lt-data-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}

      - name: Build data (pinned LanguageTool 6.6)
        run: scripts/build-data.sh

      - name: Stage binaries
        run: |
          mkdir -p storage
          cp dist/data/en_tokenizer.bin storage/en_tokenizer.bin
          cp dist/data/en_rules.bin storage/en_rules.bin

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --exclude nlprule-python --all-features

      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features regex-fancy -p nlprule

      - name: Lint with clippy
        run: cargo clippy --workspace --exclude nlprule-python --all-features

      - name: Test
        run: cargo test --workspace --exclude nlprule-python --all-features --release

      - name: Build wasm package and run its JS tests
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129
          cargo build --release --target wasm32-unknown-unknown -p writemorebetter-wasm
          wasm-bindgen --target nodejs --out-dir wasm/pkg \
            target/wasm32-unknown-unknown/release/writemorebetter_wasm.wasm
          node wasm/test.mjs

      - name: Public corpus recall
        env:
          RECALL_MIN: 55
        run: |
          cargo build --release --manifest-path bench/tools/wmb-probe/Cargo.toml
          python3 bench/tools/public_recall.py --min "$RECALL_MIN"

      - name: Disambiguation conformance
        env:
          RUST_LOG: WARN
          DISAMBIG_PASSING: 1012
        run: |
          # the binary exits 1 when any rule fails its examples; the floor below is the gate
          cargo run --release --all-features --bin test_disambiguation -- --tokenizer storage/en_tokenizer.bin > storage/disambiguation_conformance.log 2>&1 || true
          tail -n 20 storage/disambiguation_conformance.log
          runnable=$(grep -m1 '^Runnable rules: ' storage/disambiguation_conformance.log | awk '{print $3}' || true)
          passing=$(grep -m1 '^Rules passing tests: ' storage/disambiguation_conformance.log | awk '{print $4}' || true)
          echo "Runnable rules: ${runnable:-unknown}"
          echo "Rules passing tests: ${passing:-unknown}"
          if [ -z "${runnable}" ] || [ -z "${passing}" ]; then
            echo "::error::Disambiguation conformance output not found"
            exit 1
          fi
          if [ "${passing}" -lt "${DISAMBIG_PASSING}" ]; then
            echo "::error::Disambiguation conformance regressed: ${passing}/${runnable} rules passing, floor is ${DISAMBIG_PASSING} passing"
            exit 1
          fi
          if [ "${runnable}" -lt "${DISAMBIG_PASSING}" ]; then
            echo "::error::Disambiguation conformance regressed: ${runnable} runnable rules, floor is ${DISAMBIG_PASSING} (docs/BASELINE.md)"
            exit 1
          fi

      - name: Grammar conformance
        env:
          RUST_LOG: WARN
          GRAMMAR_PASSING: 6048
          GRAMMAR_RUNNABLE: 6052
        run: |
          # the binary exits 1 when any rule fails its examples; the floors below are the gate
          cargo run --release --all-features --bin test -- --tokenizer storage/en_tokenizer.bin --rules storage/en_rules.bin > storage/grammar_conformance.log 2>&1 || true
          tail -n 20 storage/grammar_conformance.log
          runnable=$(grep -m1 '^Runnable rules: ' storage/grammar_conformance.log | awk '{print $3}' || true)
          passing=$(grep -m1 '^Rules passing tests: ' storage/grammar_conformance.log | awk '{print $4}' || true)
          echo "Runnable rules: ${runnable:-unknown}"
          echo "Rules passing tests: ${passing:-unknown}"
          if [ -z "${runnable}" ] || [ -z "${passing}" ]; then
            echo "::error::Grammar conformance output not found"
            exit 1
          fi
          if [ "${passing}" -lt "${GRAMMAR_PASSING}" ]; then
            echo "::error::Grammar conformance regressed: ${passing}/${runnable} rules passing, floor is ${GRAMMAR_PASSING} passing"
            exit 1
          fi
          if [ "${runnable}" -lt "${GRAMMAR_RUNNABLE}" ]; then
            echo "::error::Grammar conformance regressed: ${runnable} runnable rules, floor is ${GRAMMAR_RUNNABLE} (docs/BASELINE.md)"
            exit 1
          fi
