name: Fuzz

on:
  push:
    branches:
      - main
    paths:
      - "nlprule/src/**"
      - "nlprule/tests/**"
      - "nlprule/fuzz/**"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "nlprule/src/**"
      - "nlprule/tests/**"
      - "nlprule/fuzz/**"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"

# Deterministic crash replay on stable Rust. A seeded generator produces a few
# thousand boundary-heavy inputs and the committed crash corpus is replayed
# through the same `suggest` + `apply_suggestions` path the app uses. The whole
# job is under two minutes. Long-running coverage fuzzing is documented in
# docs/FUZZ.md (`cargo fuzz`) and not run per-PR.
jobs:
  stress:
    name: Deterministic stress replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          # build/requirements.txt pins old packages (lxml 4.6.3); 3.9 is the newest
          # interpreter with wheels for them.
          python-version: '3.9'

      # The data is built by the same pinned script as CI and the release workflow.
      - name: Cache LanguageTool download, portable JRE and build venv
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lt-data-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}

      - name: Build data (pinned LanguageTool 6.6)
        run: scripts/build-data.sh --out-dir storage/66

      - name: Build the stress harness
        run: cargo build --release --manifest-path nlprule/fuzz/Cargo.toml --bin stress

      - name: Run deterministic stress and replay the crash corpus
        working-directory: nlprule/fuzz
        env:
          WMB_FUZZ_DIR: ${{ github.workspace }}/storage/66
        run: ./target/release/stress --iterations 3000
