name: Python

# Builds the `writemorebetter` Python wheels (abi3, CPython 3.9+) for Linux, macOS and Windows
# and the sdist, and smoke-tests each one against the LGPL data, which stays out of both.
# Nothing here publishes, and nothing runs it automatically yet: the Python package is not
# released, so neither PRs, main nor the Release workflow build it. Run it by hand (Actions →
# Python → Run workflow) for wheels. See docs/RELEASING.md.
on:
  workflow_dispatch:

# A new push to a PR cancels that PR's older runs. On main, runs never cancel each other;
# a newer push replaces only a run that is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  data:
    name: Data (LanguageTool 6.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # maturin cannot package files outside python/, so the wheel's license files are copies.
      - name: Wheel license files match the repository's
        run: |
          for file in LICENSE-MIT LICENSE-APACHE NOTICE; do
            diff -u "$file" "python/$file"
          done
          diff -ru style/data/licenses python/licenses

      - name: Lint the binding with clippy
        run: cargo clippy -p writemorebetter-python

      # The same pinned script as CI and the release workflow, cached on its inputs.
      - name: Build data (pinned LanguageTool 6.6)
        uses: ./.github/actions/build-data

      # The release data zip's layout: the two binaries at the top level.
      - uses: actions/upload-artifact@v4
        with:
          name: python-test-data
          path: |
            dist/data/en_tokenizer.bin
            dist/data/en_rules.bin
          if-no-files-found: error
          retention-days: 3

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # On Linux this builds inside a manylinux container so the wheel runs on any glibc
      # distribution from manylinux2014 on.
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
          manylinux: auto
          rust-toolchain: stable

      - uses: actions/download-artifact@v4
        with:
          name: python-test-data
          path: wmb-data

      - name: Install the wheel and smoke-test it
        env:
          WMB_DATA_DIR: ${{ github.workspace }}/wmb-data
          # Windows consoles default to a legacy code page; the smoke test prints curly quotes.
          PYTHONUTF8: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links python/dist writemorebetter
          python -m pip install pytest
          # Run from outside the checkout so the installed wheel, not python/python, is tested.
          cd "$RUNNER_TEMP"
          python - <<'EOF'
          import os
          from writemorebetter import Checker

          checker = Checker.from_dir(os.environ["WMB_DATA_DIR"], spell_variant="en_US")
          text = "🙂 “I’ll recieve it,” she said. She was went home."
          found = [(text[s.start:s.end], s.source) for s in checker.check(text)]
          print(found)
          assert ("recieve", "SPELLCHECK/SINGLE") in found, found
          assert any(span == "went" for span, _ in found), found
          EOF
          python -m pytest -q "$GITHUB_WORKSPACE/python/tests"

      # The wheel is abi3 and claims CPython 3.9+; test the oldest supported interpreter once.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.9'

      - name: Install and test the wheel on Python 3.9
        if: runner.os == 'Linux'
        env:
          WMB_DATA_DIR: ${{ github.workspace }}/wmb-data
        run: |
          python --version
          python -m pip install --no-index --find-links python/dist writemorebetter
          python -m pip install pytest
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/python/tests"

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  # The sdist carries the workspace crates the binding builds from (maturin copies path
  # dependencies in), but no LGPL data. Build a wheel from it so a broken sdist fails here
  # rather than on a user's machine.
  sdist:
    name: Sdist
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - uses: actions/download-artifact@v4
        with:
          name: python-test-data
          path: wmb-data

      - name: Install from the sdist and test it
        env:
          WMB_DATA_DIR: ${{ github.workspace }}/wmb-data
        run: |
          python -m pip install --upgrade pip
          python -m pip install python/dist/writemorebetter-*.tar.gz
          python -m pip install pytest
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/python/tests"

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error
