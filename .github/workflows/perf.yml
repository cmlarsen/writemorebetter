name: Performance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench/tools/wmb-probe -> target
      - name: Install profilers
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Cache LanguageTool download and portable JRE
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lt-download-${{ runner.os }}-6.6

      - name: Cache generated build dir
        id: build-dir
        uses: actions/cache@v4
        with:
          path: data/en-lt66
          key: build-dir-${{ runner.os }}-6.6-${{ hashFiles('build/make_build_dir.py', 'build/requirements.txt', 'build/chunker.py', 'build/builtin-data/en/**') }}

      - name: Fetch LanguageTool 6.6 and portable JRE
        run: |
          mkdir -p data storage
          eval "$(build/fetch_lt.sh data/cache 6.6)"
          echo "LT_DIR=$LT_DIR" >> "$GITHUB_ENV"
          echo "JAVA_BIN=$JAVA_BIN" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # build/requirements.txt pins old packages (lxml 4.6.3); 3.9 is the newest
          # interpreter with wheels for them.
          python-version: '3.9'

      - name: Install build-dir generator dependencies
        if: steps.build-dir.outputs.cache-hit != 'true'
        run: |
          python3 -m venv data/venv
          data/venv/bin/pip install -r build/requirements.txt

      - name: Extract LanguageTool 6.6 tagger and speller dictionaries
        if: steps.build-dir.outputs.cache-hit != 'true'
        run: |
          # LT 6.x keeps the tagger dictionary and the Morfologik speller dictionaries
          # inside a jar; extract them next to the other English resources.
          unzip -o "$LT_DIR/libs/english-pos-dict.jar" \
              'org/languagetool/resource/en/english.dict' \
              'org/languagetool/resource/en/english.info' \
              'org/languagetool/resource/en/hunspell/*.dict' \
              'org/languagetool/resource/en/hunspell/*.info' \
              -d "$LT_DIR"

      - name: Generate LanguageTool 6.6 build dir
        if: steps.build-dir.outputs.cache-hit != 'true'
        run: |
          data/venv/bin/python build/make_build_dir.py \
              --lt_dir "$LT_DIR" \
              --lang_code en \
              --tag_dict_path "$LT_DIR/org/languagetool/resource/en/english.dict" \
              --tag_info_path "$LT_DIR/org/languagetool/resource/en/english.info" \
              --spell_map_path "$LT_DIR/org/languagetool/rules/en/contractions.txt" \
              --java "$JAVA_BIN" \
              --out_dir data/en-lt66

      - name: Reuse chunker model and builtin data from the published build dir
        if: steps.build-dir.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o data/en.zip https://f000.backblazeb2.com/file/nlprule/en.zip
          unzip -q data/en.zip -d data
          cp data/en/chunker.json data/en-lt66/chunker.json
          mkdir -p data/en-lt66/builtin
          cp -r build/builtin-data/en/. data/en-lt66/builtin/

      - name: Download English 5.2 build data
        run: |
          mkdir -p data storage
          curl -sSL -o data/en.zip https://f000.backblazeb2.com/file/nlprule/en.zip
          unzip -q data/en.zip -d data
          mkdir -p data/en/builtin
          cp -r build/builtin-data/en/. data/en/builtin/

      - name: Compile both rule sets
        run: |
          for pair in 52:en 66:en-lt66; do
            version=${pair%%:*}
            build=${pair#*:}
            mkdir -p "storage/$version"
            cargo run --release --all-features --bin compile -- --build-dir "data/$build" \
              --tokenizer-out "storage/$version/en_tokenizer.bin" --rules-out "storage/$version/en_rules.bin"
          done
      - name: Golden output (both profiles and rule sets)
        run: bench/tools/golden.sh --check
      - name: Prepare merge-base engine with identical probe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          base=$(git merge-base "$BASE_SHA" HEAD)
          mkdir -p storage/base
          git archive "$base" | tar -x -C storage/base
          mkdir -p storage/base/bench/tools/wmb-probe/src
          cp bench/tools/wmb-probe/Cargo.toml storage/base/bench/tools/wmb-probe/
          cp bench/tools/wmb-probe/src/main.rs storage/base/bench/tools/wmb-probe/src/
          cp Cargo.lock storage/base/Cargo.lock
          cp bench/tools/wmb-probe/Cargo.lock storage/base/bench/tools/wmb-probe/Cargo.lock
          echo "BASE_COMMIT=$base" >> "$GITHUB_ENV"
      - name: Compile merge-base data and probe
        run: |
          root=$PWD
          cd storage/base
          for pair in 52:en 66:en-lt66; do
            version=${pair%%:*}
            build=${pair#*:}
            mkdir -p "storage/$version"
            cargo run --release --all-features --bin compile -- --build-dir "$root/data/$build" \
              --tokenizer-out "storage/$version/en_tokenizer.bin" --rules-out "storage/$version/en_rules.bin"
          done
          cargo build --release --manifest-path bench/tools/wmb-probe/Cargo.toml
      - name: Measure instructions, peak RSS and allocator calls against merge base
        run: |
          echo "Merge base: $BASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          python3 bench/tools/perf_ci.py --base storage/base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: storage/perf-ci
