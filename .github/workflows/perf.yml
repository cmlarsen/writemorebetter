name: Performance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench/tools/wmb-probe -> target
            bench/tools/wmb-chunkbench -> target
      - name: Install profilers
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: actions/setup-python@v5
        with:
          # build/requirements.txt pins old packages (lxml 4.6.3); 3.9 is the newest
          # interpreter with wheels for them.
          python-version: '3.9'
      - name: Cache LanguageTool download, portable JRE and build venv
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lt-data-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}

      - name: Build data (pinned LanguageTool 6.6)
        run: scripts/build-data.sh --out-dir storage/66

      - name: Golden output (default and fiction profiles)
        run: bench/tools/golden.sh --check

      - name: Chunker golden output
        run: bench/tools/chunker_golden.sh --check

      - name: Prepare merge-base engine with identical probe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          base=$(git merge-base "$BASE_SHA" HEAD)
          mkdir -p storage/base
          git archive "$base" | tar -x -C storage/base
          mkdir -p storage/base/bench/tools/wmb-probe/src
          cp bench/tools/wmb-probe/Cargo.toml storage/base/bench/tools/wmb-probe/
          cp bench/tools/wmb-probe/src/main.rs storage/base/bench/tools/wmb-probe/src/
          cp Cargo.lock storage/base/Cargo.lock
          cp bench/tools/wmb-probe/Cargo.lock storage/base/bench/tools/wmb-probe/Cargo.lock
          echo "BASE_COMMIT=$base" >> "$GITHUB_ENV"
      - name: Compile merge-base data and probe
        run: |
          root=$PWD
          cd storage/base
          mkdir -p storage/66
          cargo run --release --all-features --bin compile -- --build-dir "$root/data/en-lt66" \
            --tokenizer-out "storage/66/en_tokenizer.bin" --rules-out "storage/66/en_rules.bin"
          cargo build --release --manifest-path bench/tools/wmb-probe/Cargo.toml
      - name: Measure instructions, peak RSS and allocator calls against merge base
        run: |
          echo "Merge base: $BASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          python3 bench/tools/perf_ci.py --base storage/base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: storage/perf-ci
