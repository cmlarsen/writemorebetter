name: Release

# Releases are cut by hand, from main. The released XCFramework url and checksum are literals
# inside Package.swift (a remote manifest is compiled from a virtual filesystem, so it cannot
# read a sibling file) and have to be staged inside the tagged commit, which is why a tag-push
# trigger cannot work: by the time a tag exists the commit is already fixed. Instead this
# workflow rewrites those literals, tags that commit and creates the release itself. Run a dry
# run first. See docs/RELEASING.md.
#
# Tags are plain `X.Y.Z` (no `v`), matching the tag style SwiftPM needs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.7.0 (the tag name; no leading v)'
        required: true
        type: string
      dry_run:
        description: 'Build and upload the artifacts only; never commit, tag or release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dry_run: ${{ steps.check.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          # A dispatched run keeps the boolean as a string; anything that is not an
          # explicit false is a dry run. Defaults to dry so a stray run cannot publish.
          case "${DRY_RUN}" in
            false | False | FALSE) dry_run=false ;;
            *) dry_run=true ;;
          esac

          # A real release tags the commit it built, so that commit has to be main's
          # tip: refuse to publish from any other ref. A dry run is read-only and may
          # come from a branch, which is how a release is rehearsed before it merges.
          if [ "$dry_run" = "false" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "error: a release must be dispatched from refs/heads/main (got $REF)" >&2
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: version '$version' is not a plain X.Y.Z tag" >&2
            exit 1
          fi

          # The workspace crates that ship together; srx and python are versioned
          # independently on purpose.
          for manifest in nlprule/Cargo.toml build/Cargo.toml swift/Cargo.toml wasm/Cargo.toml; do
            crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -n1)
            if [ "$crate_version" != "$version" ]; then
              echo "error: $manifest is at $crate_version, not $version" >&2
              exit 1
            fi
          done

          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "error: tag $version already exists; a published tag is never moved" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

  build-data:
    name: Build data
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned so a release's data checksums can be reproduced later; the
          # toolchain is an input to the reproducible build.
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-python@v5
        with:
          # build/requirements.txt pins old packages (lxml 4.6.3); 3.9 is the newest
          # interpreter with wheels for them.
          python-version: '3.9'

      - name: Cache LanguageTool download, portable JRE and build venv
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lt-data-${{ runner.os }}-${{ hashFiles('build/requirements.txt') }}

      - name: Build data (pinned LanguageTool 6.6)
        run: scripts/build-data.sh

      # NOTICE and the third-party license texts ship in both zips and as a release asset:
      # the CMUdict, VarCon and WordNet licenses (style/data/licenses/) require binary
      # redistributions to reproduce their notices in materials provided with the distribution.
      - name: Package data
        run: |
          cp NOTICE dist/data/NOTICE
          mkdir -p dist/data/licenses
          cp style/data/licenses/* dist/data/licenses/
          cd dist/data
          zip -r "$GITHUB_WORKSPACE/writemorebetter-data-${{ needs.validate.outputs.version }}.zip" \
            en_tokenizer.bin en_rules.bin SHA256SUMS README.md LICENSE-LGPL-2.1.txt NOTICE licenses

      - uses: actions/upload-artifact@v4
        with:
          name: writemorebetter-data-${{ needs.validate.outputs.version }}
          path: writemorebetter-data-*.zip
          if-no-files-found: error

  build-xcframework:
    name: Build XCFramework
    needs: validate
    runs-on: macos-15
    outputs:
      checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Same pinned toolchain as build-data: it is an input to the artifacts.
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Build the XCFramework
        run: ./scripts/build-xcframework.sh

      # NOTICE and licenses/ sit next to the framework at the zip root; SwiftPM resolves
      # the binary target from the .xcframework and ignores them.
      - name: Package the XCFramework
        run: |
          cp NOTICE dist/NOTICE
          mkdir -p dist/licenses
          cp style/data/licenses/* dist/licenses/
          cd dist
          zip -qry "$GITHUB_WORKSPACE/WriteMoreBetterFFI.xcframework.zip" WriteMoreBetterFFI.xcframework NOTICE licenses

      - name: Compute the SwiftPM checksum
        id: checksum
        run: echo "checksum=$(swift package compute-checksum WriteMoreBetterFFI.xcframework.zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: writemorebetter-xcframework-${{ needs.validate.outputs.version }}
          path: WriteMoreBetterFFI.xcframework.zip
          if-no-files-found: error

  consumer-check:
    name: Consumer check
    needs: [validate, build-data, build-xcframework]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Download the XCFramework
        uses: actions/download-artifact@v4
        with:
          name: writemorebetter-xcframework-${{ needs.validate.outputs.version }}
          path: dist-artifacts

      - name: Download the data
        uses: actions/download-artifact@v4
        with:
          name: writemorebetter-data-${{ needs.validate.outputs.version }}
          path: data-artifacts

      - name: Unpack the data
        run: |
          mkdir -p data-consumer
          unzip -q data-artifacts/writemorebetter-data-*.zip -d data-consumer

      - name: Resolve and build the package as an app would
        run: scripts/consumer-check.sh --zip dist-artifacts/WriteMoreBetterFFI.xcframework.zip --data-dir data-consumer --version "${{ needs.validate.outputs.version }}"

  publish:
    name: Publish release
    needs: [validate, build-data, build-xcframework]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the run was dispatched from, pinned at dispatch (main's tip, since
          # only a main run publishes), so the tag lands on exactly the tree that was built.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the data
        uses: actions/download-artifact@v4
        with:
          name: writemorebetter-data-${{ needs.validate.outputs.version }}
          path: release-assets

      - name: Download the XCFramework
        uses: actions/download-artifact@v4
        with:
          name: writemorebetter-xcframework-${{ needs.validate.outputs.version }}
          path: release-assets

      - name: Stage the binary target url and checksum, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHECKSUM: ${{ needs.build-xcframework.outputs.checksum }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$VERSION"
          url="https://github.com/${REPOSITORY}/releases/download/${version}/WriteMoreBetterFFI.xcframework.zip"
          scripts/set-binary-target.sh "$url" "$CHECKSUM"

          # Release notes are CHANGELOG.md's section for this version, verbatim. The
          # heading may carry a date or a title after the version, e.g.
          # "# 0.7.0 (2026-10-12)".
          awk -v version="$version" '
            BEGIN {
              heading = version
              gsub(/\./, "\\.", heading)
              pattern = "^# " heading "([[:space:]]|$)"
            }
            $0 ~ pattern { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "error: CHANGELOG.md has no '# $version' section" >&2
            exit 1
          fi

          # Checksums of the two published archives, next to the assets.
          ( cd release-assets && sha256sum *.zip ) > release-assets/SHA256SUMS

          git config user.name "writemorebetter release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: Package.swift binary target for $version"
          # Push the commit before creating the tag: if main moved while the artifacts
          # were being built this push is rejected (non-fast-forward) and nothing is
          # tagged or released.
          git push origin HEAD:main
          git tag "$version"
          git push origin "refs/tags/$version"

          gh release create "$version" release-assets/*.zip release-assets/SHA256SUMS NOTICE \
            --repo "$REPOSITORY" \
            --title "writemorebetter $version" \
            --notes-file notes.md
