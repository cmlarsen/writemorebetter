[package]
name = "writemorebetter-style"
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Whole-document analysis for fiction style reports"

[dependencies]
nlprule = { path = "../nlprule", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["regex-onig"]
regex-onig = ["nlprule/regex-onig"]
regex-fancy = ["nlprule/regex-fancy"]

