[workspace]
members = [
    "nlprule",
    "build",
    "python",
    "srx",
    "style",
    "swift",
    "wasm"
]
exclude = [
    "bench/tools/probe",
    "bench/tools/wmb-probe",
    "bench/tools/wmb-chunkbench",
    "nlprule/fuzz",
]

# nlprule is really slow without optimizations (esp. compiling binaries)
[profile.dev]
opt-level = 2
build-override = { opt-level = 2 }
