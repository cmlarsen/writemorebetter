# Build the WebAssembly package for size, not speed.
#
# The `writemorebetter-wasm` module is loaded once per process, but V8's TurboFan tier-up compiles
# every hot wasm function at load time, and the optimized machine code it emits is far larger than
# the wasm it came from. `opt-level = 3` inlines aggressively, producing large functions that
# tier-up turns into ~40 MB of resident JIT code; `opt-level = "s"` keeps functions small and
# removes it. Measured on the English binaries in Node (wasm/REPORT.md, "Part 2 — wasm memory"):
#
#   opt-level   module   RSS after construction   story1 check   moby150k check
#   3           1.78 MB  203.6 MB                 272 ms         3793 ms
#   2           1.83 MB  213.6 MB                 296 ms         4047 ms
#   s           1.56 MB  164.4 MB                 352 ms         4691 ms
#   z           1.40 MB  162.9 MB                 407 ms         5313 ms
#
# `s` is chosen because it is the fastest profile that removes the JIT code; `z` saves 1.5 MB more
# of wasm but is ~13% slower to check. Going back to the default is a one-line change here.
#
# `wasm-opt -Oz` runs later and cannot undo the inlining opt-level 3 already did, which is why this
# has to be a compile-time flag.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "opt-level=s"]
