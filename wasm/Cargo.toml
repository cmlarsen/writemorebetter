[package]
name = "writemorebetter-wasm"
version = "0.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for writemorebetter: English grammar and spelling checking without a JVM. Bundles third-party data under its own licenses (CMUdict, CC BY word norms); see NOTICE."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
writemorebetter-style = { path = "../style", default-features = false, features = ["regex-fancy"] }
nlprule = { path = "../nlprule", default-features = false, features = ["regex-fancy"] }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
